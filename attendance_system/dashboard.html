<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Attendance System</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body onload="loadDashboard()">
    <div class="glass-card">
        <div class="profile-section">
            <div class="avatar" id="student-avatar">S</div>
            <h2 id="student-name">Loading...</h2>
            <p id="student-roll" style="margin-bottom: 0.5rem">...</p>
            <div id="status-badge" class="status-badge status-absent">Loading status...</div>
        </div>

        <button id="mark-btn" onclick="markAttendance()" class="btn-primary">
            Mark Attendance
        </button>

        <div id="message-box"></div>

        <div style="text-align: center; margin-top: 2rem;">
            <a href="#" onclick="logout()"
                style="color: rgba(255,255,255,0.6); text-decoration: none; font-size: 0.9rem;">Sign Out</a>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
