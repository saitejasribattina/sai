<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login - Attendance System</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="glass-card">
        <h1>Welcome Back</h1>
        <p>Enter your roll number to mark attendance</p>
        
        <form onsubmit="handleLogin(event)">
            <div class="form-group">
                <label for="roll-number">Roll Number</label>
                <input type="text" id="roll-number" class="input-field" placeholder="e.g. 101, 153" required autocomplete="off">
            </div>
            
            <button type="submit" class="btn-primary">
                Continue
            </button>
            <div id="message-box"></div>
        </form>
    </div>

    <script src="script.js"></script>
    <script>
        // Check if already logged in
        if(localStorage.getItem('attendance_user')) {
            window.location.href = 'dashboard.html';
        }
    </script>
</body>
</html>
